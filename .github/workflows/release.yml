name: Build & Publish AuraDesk Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installers:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_flag: "--win nsis"
          - os: macos-latest
            platform_flag: "--mac dmg --universal"
          - os: ubuntu-latest
            platform_flag: "--linux AppImage"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: |
          npm ci --foreground-scripts || npm install --foreground-scripts

      - name: Ensure Electron & esbuild Binaries
        shell: bash
        run: |
          if [ ! -d "node_modules/electron/dist" ]; then node node_modules/electron/install.js; fi
          node node_modules/esbuild/install.js || true

      - name: Typecheck & Run Automated Test Suite
        run: |
          npm run typecheck
          npm test

      - name: Build Application Bundles & Icons
        run: npm run build

      - name: Package Native 1-Click Installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.platform_flag }} --publish never

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.blockmap
          if-no-files-found: error

  publish-github-release:
    name: Publish Public GitHub Release
    needs: build-installers
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download All Platform Installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release & Attach Binaries
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-assets/*.exe
            release-assets/*.dmg
            release-assets/*.AppImage
