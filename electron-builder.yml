appId: com.auradesk.desktop
productName: AuraDesk
copyright: Copyright © 2026 AuraDesk Open Source Contributors

directories:
  buildResources: build
  output: release

npmRebuild: false

files:
  - dist/**/*
  - dist-electron/**/*
  - build/icon.png
  - build/icon.ico
  - build/icon.svg
  - package.json

win:
  icon: build/icon.ico
  signAndEditExecutable: true
  target:
    - target: nsis
      arch:
        - x64

nsis:
  script: build/installer.nsi
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AuraDesk
  artifactName: "${productName}-Setup-${version}.${ext}"

mac:
  icon: build/icon.png
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  target:
    - target: dmg
      arch:
        - universal
  artifactName: "${productName}-${version}-Universal.${ext}"

dmg:
  sign: false
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

linux:
  icon: build/icon.png
  category: Office
  synopsis: Zero-friction AI desktop workspace with visual superpowers and local memory.
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: "${productName}-${version}-${arch}.${ext}"
